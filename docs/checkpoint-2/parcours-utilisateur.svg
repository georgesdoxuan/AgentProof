<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a0071e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0071e3"/></marker><marker id="a6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="a34c759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker><marker id="aff9500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9500"/></marker></defs><rect width="1600" height="1000" fill="#f5f5f7"/><text x="64" y="78" font-size="34" font-weight="700" fill="#1d1d1f" text-anchor="start">AgentProof · parcours utilisateur</text><text x="64" y="112" font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start">Du premier clic sur l&#x27;accueil au suivi mensuel. Produit en ligne : agentproof-iota-tawny.vercel.app</text><text x="64" y="168" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">DÉCOUVRIR</text><text x="444" y="168" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">LANCER</text><text x="824" y="168" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">ATTENDRE</text><text x="1204" y="168" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">COMPRENDRE</text><text x="64" y="590" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">PROUVER</text><text x="444" y="590" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">PARTAGER</text><text x="824" y="590" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">SUIVRE</text><text x="1204" y="590" font-size="13" font-weight="700" fill="#6e6e73" text-anchor="start">RÉSULTAT</text><rect x="64" y="186" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="98" cy="222" r="16" fill="#0071e3"/><text x="98" y="228" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="126" y="229" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Accueil</text><text x="88" y="268" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Promesse : « un client mystère IA</text><text x="88" y="290" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">essaie d&#x27;acheter sur ton site ».</text><text x="88" y="312" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Rapport d&#x27;exemple, classement public</text><text x="88" y="334" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">des 10 sites mode.</text><text x="88" y="366" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">/  ·  /classement</text><rect x="444" y="186" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="478" cy="222" r="16" fill="#0071e3"/><text x="478" y="228" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="506" y="229" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Lancer l&#x27;audit</text><text x="468" y="268" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Adresse du site + un concurrent</text><text x="468" y="290" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">(facultatif), e-mail du rapport,</text><text x="468" y="312" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">appareil : ordinateur ou mobile.</text><text x="468" y="366" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">formulaire « Lancer l&#x27;audit »</text><rect x="824" y="186" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="858" cy="222" r="16" fill="#0071e3"/><text x="858" y="228" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="886" y="229" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Rapport en direct</text><text x="848" y="268" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">La page s&#x27;ouvre tout de suite et</text><text x="848" y="290" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">se remplit : 5 missions en cours,</text><text x="848" y="312" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">10 à 20 minutes. Rien à recharger.</text><text x="848" y="366" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">/audit/[id]</text><rect x="1204" y="186" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="1238" cy="222" r="16" fill="#0071e3"/><text x="1238" y="228" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1266" y="229" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Score et blocages</text><text x="1228" y="268" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Score = missions jusqu&#x27;au checkout.</text><text x="1228" y="290" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Comparaison concurrent, blocages</text><text x="1228" y="312" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">classés par impact, plan de</text><text x="1228" y="334" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">corrections écrit par un LLM.</text><text x="1228" y="366" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">/audit/[id]</text><rect x="64" y="608" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="98" cy="644" r="16" fill="#0071e3"/><text x="98" y="650" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="126" y="651" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Preuves</text><text x="88" y="690" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Dernière capture de chaque mission,</text><text x="88" y="712" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">verdict du juge visuel, et replay</text><text x="88" y="734" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">étape par étape : écran, action,</text><text x="88" y="756" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">point cliqué, raisonnement.</text><text x="88" y="788" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">/replay/[run]</text><rect x="444" y="608" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="478" cy="644" r="16" fill="#0071e3"/><text x="478" y="650" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="506" y="651" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Partager</text><text x="468" y="690" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">PDF du rapport, badge</text><text x="468" y="712" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">« Agent-ready » à coller sur le site,</text><text x="468" y="734" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">lien du rapport à l&#x27;équipe,</text><text x="468" y="756" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">marque blanche pour les agences.</text><text x="468" y="788" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">/badge/[id].svg  ·  PDF</text><rect x="824" y="608" width="340" height="200" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="858" cy="644" r="16" fill="#0071e3"/><text x="858" y="650" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="886" y="651" font-size="20" font-weight="650" fill="#1d1d1f" text-anchor="start">Suivre</text><text x="848" y="690" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Espace › Automations : surveillance</text><text x="848" y="712" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">quotidienne de la page, audit tous</text><text x="848" y="734" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">les 30 jours, alerte si le score</text><text x="848" y="756" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">baisse de 10 points ou plus.</text><text x="848" y="788" font-size="13" font-weight="500" fill="#0071e3" text-anchor="start">/espace/automations</text><rect x="1204" y="608" width="340" height="200" rx="18" fill="#e8f2fd" stroke="#b6d4f7" stroke-width="1.5"/><text x="1228" y="652" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">Le marchand sait</text><text x="1228" y="688" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start">si un agent IA peut acheter chez lui,</text><text x="1228" y="710" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start">où il bloque, preuves à l&#x27;appui,</text><text x="1228" y="732" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start">quoi corriger en premier,</text><text x="1228" y="754" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start">et s&#x27;il fait mieux que son concurrent.</text><line x1="406" y1="286" x2="440" y2="286" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><line x1="406" y1="708" x2="440" y2="708" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><line x1="786" y1="286" x2="820" y2="286" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><line x1="786" y1="708" x2="820" y2="708" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><line x1="1166" y1="286" x2="1200" y2="286" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><line x1="1166" y1="708" x2="1200" y2="708" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><path d="M 1374 388 V 560 Q 1374 548 1362 548 H 246 Q 234 548 234 560 V 604" fill="none" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><rect x="444" y="410" width="340" height="110" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="1.5" stroke-dasharray="6 6"/><text x="464" y="440" font-size="15" font-weight="650" fill="#1d1d1f" text-anchor="start">Pas encore connecté ?</text><text x="464" y="464" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Lien de connexion par e-mail, sans mot</text><text x="464" y="484" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">de passe. Le formulaire revient rempli.</text><line x1="614" y1="388" x2="614" y2="406" stroke="#6e6e73" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a6e6e73)"/><rect x="824" y="410" width="340" height="110" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="1.5" stroke-dasharray="6 6"/><text x="844" y="440" font-size="15" font-weight="650" fill="#1d1d1f" text-anchor="start">En coulisses</text><text x="844" y="464" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">L&#x27;agent Holo (H Company) joue chaque</text><text x="844" y="484" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">mission, un juge Hugging Face relit la</text><text x="844" y="504" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">dernière capture à l&#x27;aveugle.</text><line x1="994" y1="388" x2="994" y2="406" stroke="#6e6e73" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a6e6e73)"/><text x="64" y="440" font-size="15" font-weight="650" fill="#1d1d1f" text-anchor="start">Site déjà audité par l&#x27;équipe</text><text x="64" y="464" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">ces 7 derniers jours : on arrive</text><text x="64" y="484" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">directement sur le rapport existant,</text><text x="64" y="504" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">sans nouvel audit ni crédit dépensé.</text><text x="64" y="960" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start">Règle de l&#x27;agent : il s&#x27;arrête à la première page du checkout. Jamais de paiement, de compte créé, de donnée personnelle ni de captcha résolu.</text></svg>