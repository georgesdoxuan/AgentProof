<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a0071e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0071e3"/></marker><marker id="a6e6e73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker><marker id="a34c759" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34c759"/></marker><marker id="aff9500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9500"/></marker></defs><rect width="1600" height="1000" fill="#f5f5f7"/><text x="64" y="78" font-size="34" font-weight="700" fill="#1d1d1f" text-anchor="start">AgentProof · architecture technique</text><text x="64" y="112" font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start">Ce qui tourne en production aujourd&#x27;hui (main, 18 nov 2026).</text><rect x="64" y="170" width="300" height="170" rx="18" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><rect x="64" y="170" width="8" height="170" rx="4" fill="#6e6e73"/><text x="92" y="208" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">Marchand / agence</text><text x="92" y="232" font-size="14" font-weight="500" fill="#6e6e73" text-anchor="start">navigateur</text><text x="92" y="262" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Accueil, formulaire d&#x27;audit,</text><text x="92" y="283" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">rapport, replay, classement,</text><text x="92" y="304" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">espace d&#x27;équipe, PDF, badge.</text><rect x="470" y="150" width="620" height="400" rx="22" fill="#fff" stroke="#1d1d1f" stroke-width="1.5"/><text x="498" y="192" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start">App web Next.js 16 sur Vercel</text><text x="498" y="216" font-size="14" font-weight="500" fill="#6e6e73" text-anchor="start">React + Tailwind · routes API · moteur d&#x27;audit (web/lib/engine.ts)</text><rect x="498" y="242" width="274" height="116" rx="14" fill="#f5f5f7" stroke="#f5f5f7" stroke-width="1.5"/><text x="516" y="274" font-size="16" font-weight="650" fill="#1d1d1f" text-anchor="start">Pages</text><text x="516" y="300" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">/, /audit/[id], /replay/[run],</text><text x="516" y="320" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">/classement, /methode, /espace/*</text><rect x="788" y="242" width="274" height="116" rx="14" fill="#f5f5f7" stroke="#f5f5f7" stroke-width="1.5"/><text x="806" y="274" font-size="16" font-weight="650" fill="#1d1d1f" text-anchor="start">Routes API</text><text x="806" y="300" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">/api/audits : crée audit + runs</text><text x="806" y="320" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">/api/auth : lien e-mail, cookie signé</text><rect x="498" y="376" width="274" height="116" rx="14" fill="#f5f5f7" stroke="#f5f5f7" stroke-width="1.5"/><text x="516" y="408" font-size="16" font-weight="650" fill="#1d1d1f" text-anchor="start">/api/tick, chaque minute</text><text x="516" y="434" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">≤ 5 requêtes H par tick, 3 sessions</text><text x="516" y="454" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">lance, vérifie, rejoue, clôt l&#x27;audit</text><rect x="788" y="376" width="274" height="116" rx="14" fill="#f5f5f7" stroke="#f5f5f7" stroke-width="1.5"/><text x="806" y="408" font-size="16" font-weight="650" fill="#1d1d1f" text-anchor="start">Garde-fous</text><text x="806" y="434" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">juge à l&#x27;aveugle, rejeu des échecs,</text><text x="806" y="454" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">réserve de tokens, 6 audits/h/IP</text><text x="498" y="528" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start">Contrôle statique gratuit (robots.txt, schema.org, anti-bot) · surveillance via Jina Reader</text><rect x="1196" y="170" width="340" height="190" rx="18" fill="#fff" stroke="#3ecf8e" stroke-width="1.5"/><rect x="1196" y="170" width="8" height="190" rx="4" fill="#3ecf8e"/><text x="1224" y="208" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">Supabase</text><text x="1224" y="232" font-size="14" font-weight="500" fill="#3ecf8e" text-anchor="start">Postgres + Storage (eu-west-3)</text><text x="1224" y="262" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">sites, missions, audits, runs,</text><text x="1224" y="283" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">équipes, automations, favoris</text><text x="1224" y="304" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">vue site_scores (classement)</text><text x="1224" y="325" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">bucket public « screenshots »</text><rect x="470" y="640" width="380" height="220" rx="18" fill="#fff" stroke="#0071e3" stroke-width="1.5"/><rect x="470" y="640" width="8" height="220" rx="4" fill="#0071e3"/><text x="498" y="678" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">H Company Agents API</text><text x="498" y="702" font-size="14" font-weight="500" fill="#0071e3" text-anchor="start">agp.eu.hcompany.ai</text><text x="498" y="732" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">agent « agentproof-shopper »</text><text x="498" y="753" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">modèles holo4-35b-a3b (rapide)</text><text x="498" y="774" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">et holo4-27b (précis)</text><text x="498" y="795" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">navigateur cloud 1024×640 / 390×844</text><text x="498" y="816" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">événements, captures, replay partagé</text><rect x="900" y="640" width="360" height="220" rx="18" fill="#fff" stroke="#ff9d00" stroke-width="1.5"/><rect x="900" y="640" width="8" height="220" rx="4" fill="#ff9d00"/><text x="928" y="678" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">Hugging Face</text><text x="928" y="702" font-size="14" font-weight="500" fill="#ff9d00" text-anchor="start">Inference Providers + Hub</text><text x="928" y="732" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Qwen/Qwen3.5-9B :</text><text x="928" y="753" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">· juge visuel sur la capture</text><text x="928" y="774" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">· plan de corrections</text><text x="928" y="795" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Dataset public des runs</text><text x="928" y="816" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">georgesdoxuan/agentproof-runs</text><rect x="64" y="420" width="300" height="190" rx="18" fill="#fff" stroke="#ea4b71" stroke-width="1.5"/><rect x="64" y="420" width="8" height="190" rx="4" fill="#ea4b71"/><text x="92" y="458" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">n8n (VPS)</text><text x="92" y="482" font-size="14" font-weight="500" fill="#ea4b71" text-anchor="start">ordonnanceur + messages</text><text x="92" y="512" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">appelle /api/tick chaque minute</text><text x="92" y="533" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">e-mails de connexion,</text><text x="92" y="554" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">d&#x27;invitation et d&#x27;alerte</text><text x="92" y="575" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Telegram : audit terminé</text><rect x="64" y="690" width="300" height="170" rx="18" fill="#fff" stroke="#6e6e73" stroke-width="1.5"/><rect x="64" y="690" width="8" height="170" rx="4" fill="#6e6e73"/><text x="92" y="728" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">GitHub</text><text x="92" y="752" font-size="14" font-weight="500" fill="#6e6e73" text-anchor="start">repo + GitHub Actions</text><text x="92" y="782" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">push sur main : déploiement</text><text x="92" y="803" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Vercel production (CLI)</text><text x="92" y="824" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">scripts/export-hf.sh vers le Hub</text><line x1="366" y1="240" x2="466" y2="240" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><text x="418" y="230" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="middle">HTTPS</text><line x1="1092" y1="250" x2="1192" y2="250" stroke="#6e6e73" stroke-width="2" marker-end="url(#a6e6e73)"/><text x="1143" y="240" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="middle">lit / écrit</text><line x1="366" y1="500" x2="466" y2="440" stroke="#6e6e73" stroke-width="2" marker-end="url(#a6e6e73)"/><text x="410" y="455" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="middle">tick</text><line x1="466" y1="470" x2="368" y2="540" stroke="#6e6e73" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a6e6e73)"/><text x="380" y="565" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start">webhooks</text><line x1="366" y1="770" x2="466" y2="560" stroke="#6e6e73" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a6e6e73)"/><text x="398" y="735" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start">déploie</text><line x1="660" y1="552" x2="660" y2="636" stroke="#0071e3" stroke-width="2" marker-end="url(#a0071e3)"/><text x="665" y="600" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start">lance / suit les sessions</text><line x1="1080" y1="552" x2="1080" y2="636" stroke="#ff9500" stroke-width="2" marker-end="url(#aff9500)"/><text x="1088" y="600" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start">capture + mission</text><path d="M 1260 750 H 1366 V 364" fill="none" stroke="#6e6e73" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a6e6e73)"/><text x="1376" y="560" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start">export dataset</text><rect x="64" y="900" width="1472" height="64" rx="14" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="88" y="939" font-size="15" font-weight="500" fill="#1d1d1f" text-anchor="start">Flux d&#x27;un run :  formulaire  →  run « todo »  →  tick lance la session H  →  l&#x27;agent joue la mission  →  tick lit les événements (réponse, coût, capture)  →  juge HF  →  score  →  plan de corrections</text></svg>