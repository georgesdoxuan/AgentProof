# Type check and lint on every pull request and push to main, so a broken build is seen before the deploy.
# Separate from deploy.yml on purpose: a red check never blocks a hotfix deploy during the demo.
name: Check
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['retours/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
